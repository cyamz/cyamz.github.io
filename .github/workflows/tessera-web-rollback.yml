name: Roll back Tessera Web
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 已发布并包含 Web 包的正式 tag，例如 v0.2.2
        required: true
        type: string
permissions:
  contents: write
  actions: write
concurrency:
  group: tessera-version-pointer
  cancel-in-progress: false
jobs:
  rollback:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate and pin published version
        env:
          TARGET_TAG: ${{ inputs.tag }}
        run: node scripts/select-tessera-release.mjs "$TARGET_TAG"
      - name: Persist and deploy pinned version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name tessera-release-bot
          git config user.email actions@users.noreply.github.com
          git add src/data/tessera-web-release.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: roll back Tessera Web"
            git push origin HEAD:main
          fi
          gh workflow run deploy.yml --ref main
